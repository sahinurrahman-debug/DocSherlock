# Full stack locally: PostgreSQL + Qdrant + DocSherlock (API + built UI).
#   GROQ_API_KEY=gsk_... docker compose up --build        ->  http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docsherlock
      POSTGRES_PASSWORD: docsherlock
      POSTGRES_DB: docsherlock
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsherlock -d docsherlock"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports: ["5432:5432"]

  qdrant:
    image: qdrant/qdrant:latest
    volumes: [qdrant:/qdrant/storage]
    ports: ["6333:6333"]

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
      qdrant: { condition: service_started }
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+psycopg://docsherlock:docsherlock@db:5432/docsherlock
      QDRANT_URL: http://qdrant:6333
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    volumes: [uploads:/app/backend/uploads]
    ports: ["8000:8000"]

volumes:
  pgdata:
  qdrant:
  uploads:
