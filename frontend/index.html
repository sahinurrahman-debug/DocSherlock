<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DocSherlock - evidence-grounded document investigation: ask questions across PDFs, scans and notes and see what agrees, what conflicts and what is unknown." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f2e9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161917" media="(prefers-color-scheme: dark)" />
    <title>DocSherlock</title>
    <!-- applied before first paint so the page never flashes the wrong theme -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('docsherlock.theme');
          var dark = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
