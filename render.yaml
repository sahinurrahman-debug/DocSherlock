# Render Blueprint (everything on Render, free): New + -> Blueprint -> pick this repo.
#   * ONE web service serves the React UI and the API (the Dockerfile builds the frontend into the image)
#   * Render PostgreSQL, free plan: 1 GB, EXPIRES 30 days after creation (14-day grace to upgrade, then deleted).
#     For anything long-lived change `plan` below to a paid one - or paste a Neon connection string into DATABASE_URL instead.
#   * LOW_MEMORY=true keeps the process (~360 MB peak) inside the free web service's 512 MB.
databases:
  - name: docsherlock-db
    plan: free
    databaseName: docsherlock
    user: docsherlock

services:
  - type: web
    name: docsherlock
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LOW_MEMORY
        value: "true"
      - key: DATABASE_URL
        fromDatabase: { name: docsherlock-db, property: connectionString }
      - key: GROQ_API_KEY
        sync: false         # https://console.groq.com/keys
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FALLBACK_MODEL
        value: llama-3.3-70b-versatile
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
