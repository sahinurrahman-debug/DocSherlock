# Render Blueprint (free): New + -> Blueprint -> pick this repo.
#   * ONE web service serves the React UI and the API (the Dockerfile builds the frontend into the image)
#   * Database: Neon free PostgreSQL (Render allows only ONE free database per workspace and it expires after 30 days).
#     Create the Neon project first and paste its connection string as DATABASE_URL (marked "sync: false" below).
#   * LOW_MEMORY=true keeps the process (~360 MB peak) inside the free web service's 512 MB.
#   * RETENTION_DAYS=14 deletes old documents at start-up so Neon's 0.5 GB cannot fill up (~3.3 MB per loaded sample set).
services:
  - type: web
    name: docsherlock
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LOW_MEMORY
        value: "true"
      - key: RETENTION_DAYS
        value: "14"
      - key: DATABASE_URL
        sync: false         # Neon connection string (postgresql://...neon.tech/...?sslmode=require)
      - key: GROQ_API_KEY
        sync: false         # https://console.groq.com/keys
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FALLBACK_MODEL
        value: llama-3.3-70b-versatile
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
